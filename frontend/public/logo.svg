<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F8C" />
      <stop offset="50%" stop-color="#15966A" />
      <stop offset="100%" stop-color="#8065D9" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#087F8C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left Icon Mark: Dynamic D of Action & Intelligence -->
  <g transform="translate(10, 8) scale(0.74)">
    <path d="M22 14 C22 10.68 24.68 8 28 8 L52 8 C73 8 90 25 90 50 C90 75 73 92 52 92 L28 92 C24.68 92 22 89.32 22 86 Z" 
          stroke="url(#logoGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#logoShadow)" />

    <path d="M36 28 L36 72 L50 72 C62.15 72 72 62.15 72 50 C72 37.85 62.15 28 50 28 Z" 
          fill="url(#logoGrad)" 
          fill-opacity="0.12" 
          stroke="#15966A"
          stroke-width="3"
          stroke-dasharray="2 1"/>

    <path d="M36 34 L52 50 L36 66" 
          stroke="#087F8C" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="53" cy="50" r="5" fill="#15966A" />
    <circle cx="67" cy="50" r="3.5" fill="#8065D9" />
  </g>

  <!-- Brand Typography -->
  <!-- Brand Name: DOERA -->
  <text x="96" y="52" 
        font-family="'Times New Roman', Times, serif" 
        font-size="36" 
        font-weight="700" 
        letter-spacing="2.5" 
        fill="#202633">DOERA</text>

  <!-- AI Badge -->
  <rect x="254" y="27" width="46" height="26" rx="6" fill="url(#logoGrad)" />
  <text x="277" y="45" 
        font-family="'Times New Roman', Times, serif" 
        font-size="15" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="1">AI</text>

  <!-- Philosophy Subtitle -->
  <text x="98" y="72" 
        font-family="'Times New Roman', Times, serif" 
        font-size="12" 
        font-style="italic" 
        font-weight="400" 
        letter-spacing="0.5" 
        fill="#5A6679">Autonomous Task Execution</text>
</svg>
